run:
  task: carla_drive
  lr_sched: linear_warmup_cosine_lr
  init_lr: 2e-5
  min_lr: 1e-6
  warmup_lr: 5e-7
  weight_decay: 0.1
  max_epoch: 10
  batch_size_train: 2
  batch_size_eval: 2
  num_workers: 24
  warmup_steps: 2000
  seed: 42
  output_dir: output/lad_drive
  amp: true
  resume_ckpt_path: null
  evaluate: false
  train_splits:
  - train
  valid_splits:
  - val
  device: cuda
  world_size: 8
  dist_url: env://
  distributed: true
